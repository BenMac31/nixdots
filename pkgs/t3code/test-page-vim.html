<!doctype html>
<html><head><meta charset="utf-8"><title>t3pagevim</title>
<style>
  body{margin:0;font:400 16px/1.5 system-ui,sans-serif}

  table{margin:200px 0 0}

    <p id="top">The top of the page.</p>

    <input id="field" type="text">
    <h2 id="h-one">First heading</h2>
    <h2 id="h-two">Second heading</h2>
    <pre id="code-one">code</pre>
    <table id="table-one"><tr><td>cell</td></tr></table>
    <div id="box"><div>an area that scrolls on its own</div></div>
  </main>
  <pre id="out"></pre>
  <script src="page-vim.js"></script>
  <script src="test-page-vim.js"></script>
