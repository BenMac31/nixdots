[package]
name = "ridge"
version = "0.2.0"
edition = "2021"
description = "An inline fingerprint CLI with live Unicode animation for fprintd"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", default-features = false }
ctrlc = { version = "3.5", features = ["termination"] }
unicode-width = "0.2"
zbus = { version = "5.12", default-features = false, features = ["blocking-api", "async-io"] }
